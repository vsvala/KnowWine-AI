name: CI/CD Pipeline

# ── MILLOIN PIPELINE KÄYNNISTYY ──────────────────────────────────────────────
on:
  push:
    branches: [master] # jokainen push masteriin käynnistää pipelinen
  pull_request:
    branches: [master] # myös PR masteriin käynnistää testit (deploy ei aja)
    types: [opened, synchronize]

# ── TYÖT ─────────────────────────────────────────────────────────────────────
jobs:
  # ============================================================
  # JOB 1: TESTIT
  # Ajaa backend- ja frontend-testit eristettynä ympäristössä
  # ============================================================
  test:
    runs-on: ubuntu-latest # GitHub tarjoaa ilmaisen Ubuntu-virtuaalikoneen

    # Käynnistää PostgreSQL-kontin testiä varten (sama kuin paikallinen docker-kontti)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowwine_test
        ports:
          - 5433:5432 # host:5433 → kontti:5432 (sama kuin lokaali testaus)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Hakee koodin GitHubista virtuaalikoneelle
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # 2. Asentaa Node.js:n (versio 22, sama kuin lokaalisti)
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      # 3. Asentaa backendin riippuvuudet
      - name: Install backend dependencies
        run: npm ci
        working-directory: back

      - name: Check style back
        run: npm run lint
        working-directory: back

      # 4. Ajaa backend-integraatiotestit
      # NODE_ENV=test → käyttää TEST_DATABASE_URL:ia, ei Redisiä, ei GrapeMinds APIa
      - name: Run backend tests
        run: npm test
        working-directory: back
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/knowwine_test
          SECRET: test-secret-for-ci

      # 5. Asentaa frontendin riippuvuudet
      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Check style front
        run: npm run lint
        working-directory: front

      # 6. Ajaa frontend-yksikkötestit (Vitest, ei tarvitse serveriä)
      - name: Run frontend unit tests
        run: npm test
        working-directory: front

      # 6.Pipeline epäonnistuu vain High- tai Critical-tason haavoittuvuuksista.
      - name: Security audit back
        run: npm audit --audit-level=high
        working-directory: back

      - name: Security audit front
        run: npm audit --audit-level=high
        working-directory: front
  # ============================================================
  # JOB 2: e2e TESTIT
  # Ajaa e2e d-testit parallel
  #  E2E-testit (Playwright) vaativat käynnissä olevan backend+frontend-palvelimen
  #joten ne eivät voi ajaa samassa jobissa kuin unit-testit.
  e2e:
    runs-on: ubuntu-latest
    needs: test # aja vasta kun unit-testit on läpi

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowwine_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci
        working-directory: back

      - name: Start backend
        run: npm run start:test &
        working-directory: back
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/knowwine_test
          SECRET: test-secret-for-ci
          PORT: 3001
      #wait-on on npm-paketti joka pollaa URL:ia kunnes se vastaa — ei asennusta npx hakee sen automaattisesti
      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3001/api/wines --timeout 30000

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: front

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: front
        env:
          CI: true
  # ============================================================
  # JOB 3: DEPLOY
  # Ajetaan VAIN jos testit menivät läpi JA push oli masteriin
  # ============================================================
  deploy:
    needs: [test, e2e] # odottaa että "test"-job onnistuu ennen kuin alkaa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      # Lähettää HTTP POST -pyynnön Renderin deploy hook -osoitteeseen
      # Render käynnistää uuden buildin ja deployn tämän perusteella
      - name: Trigger Render deploy
        run: curl --fail -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  tag_release:
    needs: [test, e2e, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tärkeä — hakee koko git-historian tageja varten

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
